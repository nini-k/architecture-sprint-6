apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprint6-scaletestapp
  labels:
    app: scaletestapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
    spec:
      containers:
      - name: scaletestapp
        image: shestera/scaletestapp
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "30Mi"
